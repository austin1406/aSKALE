# Weekly dependency update PRs; CI runs on each one before you merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 isn't supported by typescript-eslint yet; take majors by hand when it is.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Keep Node types on the major we run (Node 22 in CI and on Vercel).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
